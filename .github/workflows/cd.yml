name: CD Pipeline

# Trigger: runs automatically after CI Pipeline completes on master
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - master

env:
  ASG_NAME: goldenowl-devops-asg
  AWS_REGION: ap-southeast-1

jobs:
  # ============================================
  # Deploy via ASG Instance Refresh
  # ============================================
  deploy:
    name: 🚀 Deploy to ASG
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger ASG Instance Refresh
        run: |
          echo "🚀 Starting instance refresh for ASG: $ASG_NAME"

          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 120}' \
            --query 'InstanceRefreshId' \
            --output text)

          echo "Instance Refresh ID: $REFRESH_ID"
          echo "REFRESH_ID=$REFRESH_ID" >> $GITHUB_ENV

      - name: Wait for Instance Refresh to complete
        run: |
          echo "⏳ Waiting for instance refresh to complete..."

          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG_NAME" \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "Current status: $STATUS"

            case $STATUS in
              Successful)
                echo "✅ Instance refresh completed successfully!"
                break
                ;;
              Failed|Cancelled|RollbackSuccessful|RollbackFailed)
                echo "❌ Instance refresh failed with status: $STATUS"
                exit 1
                ;;
              *)
                echo "⏳ Still in progress... waiting 30s"
                sleep 30
                ;;
            esac
          done
